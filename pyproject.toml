[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avf-roi"
version = "0.1.0"
description = "Availability-aware ROI fusion under joint class and modality imbalance"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "torch>=2.2", "lightgbm>=4.0"]

[project.optional-dependencies]
figures = ["reportlab>=4", "pypdfium2>=4", "pypdf>=4"]

[tool.setuptools.packages.find]
where = ["src"]
